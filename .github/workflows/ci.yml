name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase db start
      - name: pgTAP tests (RLS catalog, privacy suite, sign-up)
        run: supabase test db
      - name: Advisors (security + performance)
        run: supabase db advisors --local --level warn --fail-on warn
      - name: Generated types are up to date
        run: |
          supabase gen types typescript --local > src/lib/supabase/database.types.ts
          git diff --exit-code src/lib/supabase/database.types.ts

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
